<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness 插件上下文结构</title>
  <desc id="desc">模型、工具和状态插件通过共享上下文向任务循环、权限策略和界面提供服务。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#0b2d42"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#49b1f5"/><stop offset="1" stop-color="#00c4b6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.muted{fill:#84a6b8}.white{fill:#effaff}.cyan{fill:#6fe9ee}.small{font-size:15px;letter-spacing:2px}.label{font-size:19px;font-weight:700}.body{font-size:16px}.code{font-family:Consolas,monospace;font-size:15px;fill:#b9f7f4}.node{fill:#0d2b40;stroke:#226681;stroke-width:1.5}.line{fill:none;stroke:#2bcbd0;stroke-width:2;opacity:.8}
    </style>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <path d="M0 118H1200M0 580H1200" stroke="#18445a" opacity=".65"/>
  <text x="64" y="70" class="sans small muted">CORDIS RUNTIME / LIVE COMPOSITION</text>
  <text x="64" y="106" class="sans white" font-size="28" font-weight="750">插件如何通过共享上下文协作</text>

  <text x="70" y="172" class="sans small muted">插件贡献</text>
  <g class="sans">
    <rect class="node" x="60" y="195" width="255" height="86" rx="14"/><circle cx="91" cy="238" r="9" fill="#49b1f5"/><text x="116" y="228" class="small cyan">MODEL</text><text x="116" y="255" class="label white">模型适配器</text><text x="116" y="274" class="body muted">DeepSeek Provider</text>
    <rect class="node" x="60" y="303" width="255" height="86" rx="14"/><circle cx="91" cy="346" r="9" fill="#00c4b6"/><text x="116" y="336" class="small cyan">TOOL</text><text x="116" y="363" class="label white">工具注册</text><text x="116" y="382" class="body muted">File · Shell · Web</text>
    <rect class="node" x="60" y="411" width="255" height="86" rx="14"/><circle cx="91" cy="454" r="9" fill="#7f8cff"/><text x="116" y="444" class="small cyan">STATE</text><text x="116" y="471" class="label white">会话记录</text><text x="116" y="490" class="body muted">Append-only Log</text>
  </g>

  <path class="line" d="M315 238C370 238 368 278 423 278M315 346H423M315 454C370 454 368 414 423 414"/>
  <circle cx="423" cy="278" r="5" fill="#6fe9ee"/><circle cx="423" cy="346" r="5" fill="#6fe9ee"/><circle cx="423" cy="414" r="5" fill="#6fe9ee"/>

  <rect x="422" y="180" width="356" height="338" rx="28" fill="#0a2235" stroke="url(#accent)" stroke-width="2.5" filter="url(#glow)"/>
  <text x="600" y="225" text-anchor="middle" class="sans small cyan">SHARED CONTEXT</text>
  <text x="600" y="283" text-anchor="middle" class="sans white" font-size="62" font-weight="800">ctx</text>
  <text x="600" y="313" text-anchor="middle" class="sans body muted">服务容器 · 事件总线 · 生命周期</text>
  <g class="sans">
    <rect x="459" y="342" width="282" height="45" rx="9" fill="#12384c"/><text x="480" y="370" class="small muted">服务</text><text x="548" y="370" class="code">ctx.llm · ctx.tools · ctx.sessions</text>
    <rect x="459" y="398" width="282" height="45" rx="9" fill="#12384c"/><text x="480" y="426" class="small muted">事件</text><text x="548" y="426" class="code">agent/* · tools/* · session/*</text>
    <rect x="459" y="454" width="282" height="45" rx="9" fill="#12384c"/><text x="480" y="482" class="small muted">副作用</text><text x="548" y="482" class="code">effect() · on() · dispose()</text>
  </g>

  <path class="line" d="M778 278C833 278 830 238 885 238M778 346H885M778 414C833 414 830 454 885 454"/>
  <circle cx="778" cy="278" r="5" fill="#6fe9ee"/><circle cx="778" cy="346" r="5" fill="#6fe9ee"/><circle cx="778" cy="414" r="5" fill="#6fe9ee"/>

  <text x="894" y="172" class="sans small muted">插件消费</text>
  <g class="sans">
    <rect class="node" x="885" y="195" width="255" height="86" rx="14"/><text x="914" y="228" class="small cyan">LOOP</text><text x="914" y="255" class="label white">任务循环</text><text x="914" y="274" class="body muted">Agent Loop</text>
    <rect class="node" x="885" y="303" width="255" height="86" rx="14"/><text x="914" y="336" class="small cyan">POLICY</text><text x="914" y="363" class="label white">权限与沙箱</text><text x="914" y="382" class="body muted">Guarded Execution</text>
    <rect class="node" x="885" y="411" width="255" height="86" rx="14"/><text x="914" y="444" class="small cyan">UI</text><text x="914" y="471" class="label white">产品界面</text><text x="914" y="490" class="body muted">Web · CLI · SDK</text>
  </g>

  <g class="sans">
    <rect x="60" y="598" width="1080" height="64" rx="15" fill="#0b2132" stroke="#1e556d"/>
    <circle cx="118" cy="630" r="18" fill="#143e54"/><text x="118" y="636" text-anchor="middle" class="small cyan">01</text><text x="150" y="626" class="label white">挂载</text><text x="150" y="647" class="body muted">声明依赖后接入</text>
    <path d="M330 630H410" stroke="#2bcbd0" stroke-width="2"/><path d="m402 623 9 7-9 7" fill="none" stroke="#2bcbd0" stroke-width="2"/>
    <circle cx="472" cy="630" r="18" fill="#143e54"/><text x="472" y="636" text-anchor="middle" class="small cyan">02</text><text x="504" y="626" class="label white">通信</text><text x="504" y="647" class="body muted">通过服务和事件协作</text>
    <path d="M742 630H822" stroke="#2bcbd0" stroke-width="2"/><path d="m814 623 9 7-9 7" fill="none" stroke="#2bcbd0" stroke-width="2"/>
    <circle cx="884" cy="630" r="18" fill="#143e54"/><text x="884" y="636" text-anchor="middle" class="small cyan">03</text><text x="916" y="626" class="label white">卸载</text><text x="916" y="647" class="body muted">副作用随插件撤销</text>
  </g>
</svg>
